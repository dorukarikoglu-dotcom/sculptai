<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment verification</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#101828}.w{max-width:680px;margin:80px auto;padding:0 20px}.c{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:28px;box-shadow:0 12px 30px rgba(16,24,40,.06)}h1{letter-spacing:-.04em}.muted{color:#667085}.ok{color:#067647}.bad{color:#b42318}.btn{display:inline-block;margin-top:14px;padding:11px 14px;background:#101828;color:#fff;border-radius:10px;text-decoration:none;font-weight:800}</style></head><body><div class="w"><div class="c"><h1 id="title">Verifying payment…</h1><p id="msg" class="muted">Please keep this page open for a moment.</p><a class="btn" href="/venture-engine/">Back to Venture Engine</a></div></div><script>const q=new URLSearchParams(location.search),session=q.get('session_id')||'',venture=q.get('venture')||'';async function verify(){try{const r=await fetch('/api/venture-checkout-status?session_id='+encodeURIComponent(session)+'&venture='+encodeURIComponent(venture));const d=await r.json();if(r.ok&&d.paid){title.textContent='Payment verified ✓';title.className='ok';msg.textContent='Thank you. The Venture Engine recorded a verified '+d.amount+' '+d.currency+' purchase. Fulfillment activation is the next step.';return}title.textContent='Payment not confirmed yet';title.className='bad';msg.textContent='Stripe has not confirmed this payment yet. If you completed payment, refresh this page in a moment.'}catch(e){title.textContent='Could not verify payment';title.className='bad';msg.textContent='Please refresh this page in a moment.'}}verify();</script></body></html>
