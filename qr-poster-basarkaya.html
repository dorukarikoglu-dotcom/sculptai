<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SculptAI QR Poster — Op. Dr. Başar Kaya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Nunito:wght@300;400;500;600;700&display=swap">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 210mm;
    height: 297mm;
    background: #ffffff;
    font-family: 'Nunito', sans-serif;
    color: #1e3a5f;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 36mm 28mm 24mm;
  }

  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    letter-spacing: 0.02em;
  }
  .logo-sculpt { font-weight: 700; color: #1e3a5f; }
  .logo-ai { font-weight: 500; font-style: italic; color: #1d4ed8; }
  .clinic-name {
    font-size: 13px;
    font-weight: 400;
    color: #7b9ab5;
    letter-spacing: 0.06em;
  }

  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 700;
    color: #1e3a5f;
    text-align: center;
    line-height: 1.3;
  }
  .subtitle {
    font-size: 15px;
    font-weight: 400;
    color: #7b9ab5;
    text-align: center;
  }
  .qr-frame img {
    width: 500px;
    height: 500px;
    display: block;
  }
  .qr-hint {
    font-size: 14px;
    color: #93adc4;
    letter-spacing: 0.03em;
  }

  .footer {
    font-size: 10px;
    color: #b0c4d8;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

  <div class="top">
    <div class="logo"><span class="logo-sculpt">Sculpt</span><span class="logo-ai">AI</span></div>
    <div class="clinic-name">Op. Dr. Başar Kaya Plastik Cerrahi Kliniği</div>
  </div>

  <div class="center">
    <div class="main-title">Muayeneye Hazırlıklı Girin</div>
    <div class="subtitle">5 dakikalık form · Doktorunuz sizi daha iyi anlar</div>
    <div class="qr-frame">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://app.sculptai.health/form/4f6433f7-2bc3-4da9-9915-0c40ab47a07b" alt="QR Kod">
    </div>
    <div class="qr-hint">QR kodu telefonunuzla tarayın</div>
  </div>

  <div class="footer">KVKK uyumlu · sculptai.health</div>

</body>
</html>
